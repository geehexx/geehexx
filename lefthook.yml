pre-commit:
  parallel: false
  commands:
    public-surface:
      run: python3 scripts/check_public_surface.py --staged --require-private-rules --private-rules .private/policy.txt
    readme-lint:
      run: python3 scripts/lint_readme.py README.md
    yaml-lint:
      run: python3 scripts/check_yaml.py --staged
    gitleaks:
      run: gitleaks git --staged --redact --no-banner
