repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=750"]
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: local
    hooks:
      - id: public-surface
        name: public-surface
        entry: uv run python scripts/check_public_surface.py --staged --private-rules .private/policy.txt # public-surface-allow
        language: system
        pass_filenames: false
      - id: profile-readme-sync
        name: profile-readme-sync
        entry: uv run profile-cv render-profile --check
        language: system
        pass_filenames: false
      - id: readme-lint
        name: readme-lint
        entry: uv run python scripts/lint_readme.py README.md
        language: system
        pass_filenames: false
