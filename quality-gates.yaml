# Repo-specific quality policy for public profile and CV generation.
public_surface:
  public_files:
    - .editorconfig
    - .gitattributes
    - .pre-commit-config.yaml
    - .python-version
    - AGENTS.md
    - CHANGELOG.md
    - LICENSE
    - Makefile
    - README.md
    - lefthook.yml
    - pyproject.toml
    - quality-gates.yaml
    - resume.yaml
  public_dir_prefixes:
    - .github/
    - docs/
    - schemas/
    - scripts/
    - src/
    - styles/
    - templates/
    - tests/
    - vendor/
  scan_excluded_files:
    - quality-gates.yaml
  blocked_tracked_paths:
    - '^source/'
    - '^dist/'
    - '^site/'
    - '^_qa'
    - '^\.private/'
    - '^planning/'
    - '^research-notes/'
    - '^notes/'
    - '^handoff/'
    - '^uv\.lock$'
    - '^\.venv(?:/|$)'
    - '^resume/'
  binary_suffixes:
    - .docx
    - .gif
    - .jpeg
    - .jpg
    - .pdf
    - .png
    - .zip
  private_allow_marker: public-surface-allow
  text_rules:
    absolute-home-path: '/home/[A-Za-z0-9._-]+(?:/|\b)'
    tilde-projects-path: '~/projects(?:/|\b)'
    windows-user-path: '/mnt/c/Users/[A-Za-z0-9._-]+(?:/|\b)'
    private-folder-path: '(^|\s)(?:\.private|planning|research-notes|notes)/'
    tool-citation-leak: '(?:turn\d+(?:file|search|view)\d+|sandbox:/mnt/data)'
    internal-package-index: '(?:packages\.[A-Za-z0-9.-]*internal|internal\.[A-Za-z0-9.-]+|artifactory)'
    private-key-header: '-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'
    aws-access-key-id: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    github-token: '\bgh[pousr]_[A-Za-z0-9_]{30,}\b'
    openai-api-key: '\bsk-[A-Za-z0-9_-]{32,}\b'
    anthropic-api-key: '\bsk-ant-[A-Za-z0-9_-]{32,}\b'
    google-api-key: '\bAIza[0-9A-Za-z_-]{35}\b'
    slack-token: '\bxox[baprs]-[A-Za-z0-9-]{20,}\b'
    generic-secret-assignment: '(?i)\b(?:api[_-]?key|secret|token|password)\b\s*[:=]\s*[''"]?[A-Za-z0-9_./+=-]{24,}'

source_validation:
  required_top_level:
    - basics
    - work
    - education
    - skills
    - projects
    - meta
  required_tokens:
    - Andrew Crozier
    - PydanticAI
    - LangGraph
    - AWS Bedrock
    - 100K+ RPM
    - millions of properties
    - Australian citizen
    - KrisFlyer
    - library-ops
    - MCP
  fact_risk_tokens:
    - WestJet
    - CTO & Co-Founder
    - Co-founded
    - co-founder
    - 2.4M+ properties
    - Naspers / OLX
    - OLX Group
    - Citibank
    - 3,000+ businesses
    - 440 categories
    - Australia-based, currently traveling Asia

artifact_qa:
  required_text_tokens:
    - Andrew Crozier
    - Summary
    - Technologies
    - Experience
    - Selected Public Work
    - Education
    - PydanticAI
    - LangGraph
    - AWS CDK
    - MCP
    - Australian citizen
    - millions of properties
    - library-ops
  forbidden_text_tokens:
    - '{{'
    - '}}'
    - TODO
    - undefined
    - HIGHLIGHTS
    - "SUMMARY\n"
  forbidden_ats_tokens:
    - text box
    - skill bar
    - two-column
    - multi-column
