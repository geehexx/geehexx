# Repo-specific repository surface policy.
public_surface:
  public_files:
    - .editorconfig
    - .gitattributes
    - .pre-commit-config.yaml
    - .python-version
    - AGENTS.md
    - CHANGELOG.md
    - LICENSE
    - Makefile
    - README.md
    - lefthook.yml
    - pyproject.toml
    - quality-gates.yaml
    - resume.yaml
  public_dir_prefixes:
    - .github/
    - docs/
    - schemas/
    - scripts/
    - src/
    - styles/
    - templates/
    - tests/
    - vendor/
  blocked_tracked_paths:
    - '^source/'
    - '^dist/'
    - '^site/'
    - '^_qa'
    - '^\.private/'
    - '^planning/'
    - '^research-notes/'
    - '^notes/'
    - '^handoff/'
    - '^uv\.lock$'
    - '^\.venv(?:/|$)'
  binary_suffixes:
    - .docx
    - .gif
    - .jpeg
    - .jpg
    - .pdf
    - .png
    - .zip
