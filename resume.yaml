  x_profile:
    title: Andrew Crozier
    subtitle: Applied AI & Software Engineering · Hands-on Technical Leadership
    tagline: Production agents · Hybrid retrieval · MCP systems · Distributed platforms · Reliability
      engineering
    opener: 'I build the parts of AI systems that still have to work after the demo: retrieval quality,
      tool boundaries, stream safety, retry behavior, evaluation loops, human approval gates, observability,
      infrastructure, and the engineering habits around them.'
    positioning:
    - 'I work where LLMs meet backend engineering: agent orchestration, RAG, search, evals, governance,
      distributed systems, platform reliability, and the unglamorous failure paths that decide whether
      an AI product survives real users.'
    - 'I am not trying to be a pure people manager. I have led teams, hired engineers, run delivery systems,
      written RFCs, and handled performance management, but my strongest work is still hands-on technical
      leadership: shaping systems, debugging hard edges, and helping teams make better engineering decisions.'
    now:
      summary: Building production agentic workflows, hybrid retrieval, human-in-the-loop controls, and
        cloud infrastructure for enterprise decision support.
      areas:
      - system: Agentic architecture
        focus: Multi-step agent workflows, tool boundaries, approval gates, typed failure paths, and quality
          checks before autonomy expands
      - system: Retrieval & discovery
        focus: Hybrid lexical / semantic retrieval, ranking, query interpretation, and graceful degradation
          for vague or under-specified requests
      - system: Conversation systems
        focus: Stateful conversational flows, streaming behavior, guarded tool use, and product-facing
          interaction design
      - system: Platform engineering
        focus: AWS-based service architecture, infrastructure-as-code, data stores, security controls,
          and rollback-friendly deployment paths
      - system: Reliability hardening
        focus: Retry classification, stalled-stream handling, observability, resource isolation, and explicit
          operating constraints
    publicWorkIntro: 'I use GitHub less as a trophy case and more as a public engineering notebook: tools,
      experiments, reliability patches, and production-inspired patterns that expose how I think.'
    failureModesIntro: A lot of applied AI engineering is not prompt cleverness. It is removing ambiguity
      from failure paths.
    failureModes:
    - name: Retry storms under fan-out
      detail: bounded retry budgets, token buckets, and backoff behavior that does not amplify provider
        pain.
    - name: Hard quota vs transient throttling
      detail: body-content classification so retries do not burn budget against unrecoverable walls.
    - name: Silent stream failures
      detail: per-chunk stalled-stream protection and typed terminal errors instead of partial, misleading
        output.
    - name: Unsafe tool autonomy
      detail: approval gates and write-path blocks around irreversible actions, credentials, and protected
        directories.
    - name: Weak retrieval confidence
      detail: hybrid retrieval, rank fusion, query scoping, and evaluation before expanding agent autonomy.
    - name: Operational folklore
      detail: ADRs, RFCs, runbooks, and decisions written down before they become archaeology.
    engineeringBiases:
    - Typed errors over mysterious fallthroughs.
    - Guardrails around irreversible tool actions.
    - Evals before more autonomy.
    - Observability before optimism.
    - Explicit retry budgets; no infinite faith in exponential backoff.
    - Hybrid retrieval when lexical precision and semantic recall both matter.
    - Infrastructure that rolls back cleanly.
    - Teams that write decisions down before decisions become folklore.
    longerThread:
    - 'I got here the long way: programming young, learning by building, breaking things, and repeatedly
      deciding I needed to understand the layer underneath the abstraction.'
    - That meant mIRC scripting, C++, BSD/network programming, GTK+, ncurses, Linux without a GUI for
      longer than was sensible, Django before it was boring, marketplace systems, fintech workflows, booking
      platforms, talent-matching systems, and now production AI systems.
    - The through-line is not a framework. It is systems curiosity plus enough production scar tissue
      to know where prototypes usually fail.
    usefulConversations:
    - building production AI / agent platforms
    - taking RAG systems from prototype to measurable quality
    - hardening distributed systems under real load
    - designing human-in-the-loop governance for AI workflows
    - building MCP and developer workflow tools
    - leading backend / platform teams without drifting away from the code
    - diagnosing reliability failures across infrastructure, code, process, and team boundaries
    openTo: AI engineering, software engineering, backend/platform engineering, and hands-on technical
      leadership roles. Remote across Australia / APAC / EU / UK overlap preferred; Australia relocation
      or other on-site arrangements possible for the right role.
